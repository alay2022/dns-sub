name: Backup D1 Database

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Export database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d64c5047d3766087d1b9b2bed2de17a9
        run: |
          npx wrangler d1 export dns-sub --remote -y --output=backup-$(date +%Y%m%d).sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-sub-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90
